  m19a-the-published-suite-runs-from-the-tarball-and-does-not-kill-its-consumer: done   # SHIPPED 2026-09-04. Two things, and the second was FOUND BY the first. (1) THE PROMISE HAD NO GATE. `AGENTS.md:59-63` says a port is implementable installing ONLY `@panda/contracts`; FR-9 (`epics.md:26`) says a "published suite validates any ExecutorAdapter"; NFR-8 (`epics.md:58`) says "public contract-test suite per Contract". The word in all three is PUBLISHED, and all six in-repo callers of the three suite runners resolve through pnpm `workspace:*` links -- which, as this proof's own header already said about `consumer.test.ts`, answer no matter what the export map, the build or the tarball say. The contracts-only scenario proved TYPE resolution (`implements WorkspaceProvider` compiles) and never ran a clause. Now it runs the published workspace suite from the installed tarball against a HALF-RIGHT subject, and the halves are the control: a subject that passes everything and a suite that checks nothing are the same green, one that fails everything and a suite that throws on everything are the same red, so BOTH sets are asserted non-empty and the two planted violations are named. Clause list compared against the workspace's own array rather than a literal count, so it reddens in both directions. Measured 9 clauses / 6 passing / 3 violated FROM THE TARBALL. Refused: the framing's premise that the arrays might be unreachable -- they are re-exported through the root barrel and ship under `files: ["dist"]`, verified by packing and importing. (2) AND IT IMMEDIATELY FOUND A DEFECT IN THE PUBLISHED SUITE ITSELF, which is the whole argument for the gate. `disposed-provider-rejects-operations` builds its probes as an ARRAY LITERAL OF CALLS, so every probe starts before the loop's first `await`, and the `if (!outcome.ok) return outcome` abandons the ones it never reached -- their rejections then have no handler and land in the CONSUMER's process. A conformance suite that crashes the process it is diagnosing, exactly when the diagnosis is 'your port is wrong'. TWO SITES: `workspace-clauses.ts` (three probes) and `memory-clauses.ts` (FIVE, so four abandoned); `executor-clauses.ts` has no such loop, controlled. Invisible to every in-repo run because panda's OWN providers PASS the clause and therefore await every probe -- the leak needs a NON-conformant subject, which is precisely who a published suite is for. Also invisible because vitest folds an unhandled rejection into its own reporting while a bare `node consumer.mjs` turns it into a non-zero exit, and the FR-29 proof is the only thing here that runs a bare node process. Fixed with thunks at both sites. THE GATE FOR THE CLASS: `contracts/test/contract-suite.test.ts` asserts a process-level `unhandledRejection` listener stays empty while the report is still correct -- because the report WAS correct when the process died, so an assertion about the report could never have caught it. Falsified per site: reverting workspace reddens one clause, reverting memory reddens the other. THE MEMORY SUBJECT TOOK THREE ATTEMPTS and the reason is recorded in the test: a stub broken EVERYWHERE never reaches the loop, because the clause opens with `entryCount(provider)` -> `describe()`, so it fails before creating a single probe and the gate passes while pinning NOTHING. The first version of that test was exactly that -- green with the fix reverted. A subject has to be healthy enough to ARRIVE and wrong in exactly one place once it does. Two coordinator hypotheses died by construction on the way: that `raceTimeout` leaks a discarded promise (it does not -- `Promise.race` subscribes to both racers and marks the loser handled), and that `mcp-source.ts` was a second leak site in M18.A. Spec: none -- this was measured out of a two-seat debate rather than specified, and the debate's own framing was wrong on three counts, corrected in `0d2e2f6`.
