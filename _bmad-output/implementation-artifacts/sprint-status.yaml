  4-3-crash-safe-disposal: done   # shipped in m16a. Originally: in m16a. NOT blocked, and the earlier assessment that it needed a persisted session log was WRONG -- that read the DSH note's summary instead of the AC. The AC is worktree disposal: "a disposal killed mid-operation... the next startup sweep... the trash-pattern leftover is reconciled and removed". Measured at 3209fc7: panda creates a worktree on every `panda run` under the git-worktree provider and has NO way to remove one -- `panda --help` mentions workspaces only under `run`, the verb that creates them (control: the same help lists every other verb), and `WorktreeLedger` exposes no removal path. The source names this story at the exact line it declined: git-worktree-provider.ts:167-173 (`dispose()` "removes nothing... tree removal is Story 4.3") and :100-103 (`--detach`, "branch lifecycle belongs to crash-safe disposal"). FR-20's "merged branches may be deleted while unmerged preserved" has NO SUBJECT in the shipped design -- panda creates detached worktrees and no branches (verified in M10.A's own run: `detached` in `git worktree list --porcelain`) -- so that clause is closed as not-applicable with its evidence and reopens if panda ever creates a branch. Its INTENT is implemented against a hazard measured in real git that GIT ITSELF DOES NOT GUARD: a worktree with modified or untracked files is refused ("use --force to delete it"), but a detached HEAD carrying a COMMIT is removed SILENTLY and `git branch --contains` returns 0 -- the commit is reachable from nothing. Spec: spec-m16a-a-worktree-panda-made-is-a-worktree-panda-can-take-back.md
