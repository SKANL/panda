name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are source/developer validation runtimes. The root toolchain
        # floor is >=24, while publishable package compatibility is measured
        # separately by the packed-artifact consumer-floor job below.
        # Keep the exact 22.18.0 leg because source tests spawn child Node
        # processes that import TypeScript and require that developer floor.
        node-version: ['22.18.0', 22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + test + lint)
        run: pnpm check

      # The build and the FR-29 proof, in the same job so they reuse the install
      # and the pnpm store the proof's `--offline` consumer install needs.
      #
      # `pnpm check` deliberately needs no build, which is what kept a broken
      # `tsconfig.build.json` invisible: nothing ran the emit path, and nothing
      # ran the proof either — a script no automation invokes is unreachable by
      # default, which is worse than a flag nobody sets. Together they cost about
      # 35s against a ~47s `pnpm check`.
      - name: Build
        run: pnpm build

      - name: FR-29 consumer-install proof
        run: pnpm proof:consumer-install

  # Build once on the supported toolchain, then test only the packed artifacts
  # on candidate consumer runtimes. This deliberately does not install pnpm,
  # run Vitest, invoke TypeScript, or load repository source files.
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack publishable tarballs
        run: node scripts/pack-publishable.mjs "$RUNNER_TEMP/panda-tarballs"

      - name: Upload packed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panda-publishable-tarballs
          path: ${{ runner.temp }}/panda-tarballs
          if-no-files-found: error

  consumer-floor:
    needs: build-pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22.13.0', '22.18.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download packed artifacts
        uses: actions/download-artifact@v4
        with:
          name: panda-publishable-tarballs
          path: ${{ runner.temp }}/panda-tarballs

      - name: Run plain Node consumer smoke
        env:
          npm_config_engine_strict: 'false'
          NPM_CONFIG_ENGINE_STRICT: 'false'
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP/panda-tarballs"
