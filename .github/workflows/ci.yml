name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 IS HERE TO MAKE A CLAIM TESTABLE, not because anything runs on it
        # yet. Every manifest declares `engines: node >=24`, and that floor is
        # above EVERY comparable published package measured (the peer floors are
        # 16, 18, 18, 20, 20, 22, 22, 22, 22.13, 22; five declare none). Driven
        # against panda's own source, nothing requires 24: `tsconfig.base.json`
        # targets `es2023`, the only version-gated APIs are `structuredClone`
        # (Node 17+) and `node:sqlite`'s `DatabaseSync` (>= 22.5) in
        # `memory-sqlite`, which is outside the CLI's runtime closure and lazily
        # imported even there. The floor's stated reason is "CI runs Node 24",
        # which is a fact about CI and not about the code.
        #
        # Lowering the number first would be a guarantee in prose with nothing
        # that fails when violated. So the test comes first: if 22 is green, the
        # floor can move with evidence; if it is red, the floor is earned and the
        # real reason gets written down instead of the CI one.
        #
        # THE FLOOR IS SET BY THE TOOLCHAIN, NOT BY PANDA'S CODE, and that was
        # measured rather than assumed. `22` went green on all three gates, so
        # `engines: >=24` was unpaid-for. The next leg tried `22.5.0` — the
        # release `node:sqlite`'s `DatabaseSync` landed in, and the lowest
        # version anything in this workspace could possibly need — and it failed
        # before a single test ran:
        #
        #     ERROR: This version of pnpm requires at least Node.js v22.13
        #
        # That is a constraint on BUILDING panda, not on consuming it. A consumer
        # installs with whatever package manager they like and runs `dist`; they
        # never run this repository's pnpm. So `22.13.0` is the lowest version
        # this matrix can prove anything about, and `engines` says exactly that
        # rather than the lower number the code would actually tolerate.
        #
        # To prove a floor BELOW the toolchain's, the job shape has to change:
        # build and pack once on a high Node, then install and RUN the tarballs
        # on the lower ones. That is the honest way to answer "what does a
        # consumer need", and it is recorded in deferred-work rather than guessed
        # at here.
        #
        # `22` stays alongside `22.13.0`: the exact floor and the LTS head pin
        # both ends of the range panda declares.
        node-version: ['22.13.0', 22, 24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + test + lint)
        run: pnpm check

      # The build and the FR-29 proof, in the same job so they reuse the install
      # and the pnpm store the proof's `--offline` consumer install needs.
      #
      # `pnpm check` deliberately needs no build, which is what kept a broken
      # `tsconfig.build.json` invisible: nothing ran the emit path, and nothing
      # ran the proof either — a script no automation invokes is unreachable by
      # default, which is worse than a flag nobody sets. Together they cost about
      # 35s against a ~47s `pnpm check`.
      - name: Build
        run: pnpm build

      - name: FR-29 consumer-install proof
        run: pnpm proof:consumer-install
