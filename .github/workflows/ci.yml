name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + test + lint)
        run: pnpm check

      # The build and the FR-29 proof, in the same job so they reuse the install
      # and the pnpm store the proof's `--offline` consumer install needs.
      #
      # `pnpm check` deliberately needs no build, which is what kept a broken
      # `tsconfig.build.json` invisible: nothing ran the emit path, and nothing
      # ran the proof either — a script no automation invokes is unreachable by
      # default, which is worse than a flag nobody sets. Together they cost about
      # 35s against a ~47s `pnpm check`.
      - name: Build
        run: pnpm build

      - name: FR-29 consumer-install proof
        run: pnpm proof:consumer-install
